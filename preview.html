<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Frankie – Grafik-Vorschau</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; padding: 16px; background: #9fd6ff; font-family: sans-serif; }
      .grid { display: flex; flex-wrap: wrap; gap: 12px; }
      figure { margin: 0; background: #bfe6ff; border-radius: 8px; padding: 6px; }
      figcaption { font-size: 12px; text-align: center; color: #4a2c17; }
      img { display: block; }
    </style>
  </head>
  <body>
    <!-- Developer page: shows every drawing large, to judge the art without playing.
         ?zoom=3 shows them bigger, ?set=beach only one group (frankie, world, scenery, forest, beach, farm, winter, party, puszta, budapest). -->
    <div class="grid" id="grid"></div>
    <script type="module">
      import { frankieSvg, FRANKIE_W, FRANKIE_H } from './src/art/frankie.js';
      import { worldSvgs } from './src/art/world.js';
      import { scenerySvgs } from './src/art/scenery.js';
      import { forestSvgs } from './src/art/forest.js';
      import { beachSvgs } from './src/art/beach.js';
      import { farmSvgs } from './src/art/farm.js';
      import { winterSvgs } from './src/art/winter.js';
      import { partySvgs } from './src/art/party.js';
      import { pusztaSvgs } from './src/art/puszta.js';
      import { budapestSvgs } from './src/art/budapest.js';

      const grid = document.getElementById('grid');
      const params = new URLSearchParams(location.search);
      const zoom = Number(params.get('zoom') || 2);
      const only = params.get('set');
      const add = (name, svg, w, h) => {
        const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
        grid.insertAdjacentHTML('beforeend', `<figure><img src="${url}" width="${w * zoom}" height="${h * zoom}" style="max-width: 90vw; height: auto"><figcaption>${name}</figcaption></figure>`);
      };
      if (!only || only === 'frankie') {
        for (const name of ['run0', 'run1', 'run2', 'run3', 'jump', 'bonk', 'happy', 'eat0', 'eat1']) {
          add(name, frankieSvg(name), FRANKIE_W, FRANKIE_H);
        }
      }
      const sets = { world: worldSvgs, scenery: scenerySvgs, forest: forestSvgs, beach: beachSvgs, farm: farmSvgs, winter: winterSvgs, party: partySvgs, puszta: pusztaSvgs, budapest: budapestSvgs };
      for (const [set, svgs] of Object.entries(sets)) {
        if (only && only !== set) continue;
        for (const [name, { svg, w, h }] of Object.entries(svgs())) add(name, svg, w, h);
      }
    </script>
  </body>
</html>
